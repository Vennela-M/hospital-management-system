<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow" style="width:350px">

    <h3 class="text-center mb-3">Signup</h3>

    <input id="name" class="form-control mb-2" placeholder="Full Name">

    <input id="contact" class="form-control mb-2" placeholder="Email or Mobile Number">

    <div class="input-group mb-2">
        <input id="password" type="password" class="form-control" placeholder="Password">
        <button class="btn btn-outline-secondary" onclick="togglePassword()">👁️</button>
    </div>

    <button class="btn btn-success w-100 mb-2" onclick="signup()">Signup</button>

    <p class="text-center">
        Already have an account? <a href="login.html">Login</a>
    </p>

</div>

<script src="js/main.js"></script>

</body>
</html>
