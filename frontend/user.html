<!DOCTYPE html>
<html>
<head>
  <style>
.card:hover {
    transform: scale(1.03);
    transition: 0.3s;
}
</style>
  <title>User Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<h3 id="welcome"></h3>

<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">Hospital Dashboard</span>
  <button class="btn btn-danger" onclick="logout()">Logout</button>
</nav>
<div class="container mt-5">

  <h2 id="welcomeText"></h2>

  <div class="row mt-4">

    <div class="col-md-4">
      <div class="card p-3 shadow text-center" onclick="showAppointments()" style="cursor:pointer;">
        <h5>Appointments</h5>
        <p>View & Book</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3 shadow text-center" onclick="showDoctors()" style="cursor:pointer;">
        <h5>Doctors</h5>
        <p>Find Specialists</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3 shadow text-center" onclick="showProfile()" style="cursor:pointer;">
        <h5>Profile</h5>
        <p>Manage Details</p>
      </div>
    </div>

  </div>

  <!-- 🔥 Dynamic Section -->
  <div id="mainContent" class="mt-4"></div>

</div>

<script>
function logout(){
  window.location = "index.html";
}
</script>
<script src="js/main.js"></script>
<script>
    checkAuth();
    loadUserDashboard();
</script>
</body>
</html>
