<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow" style="width:350px">

    <h3 class="text-center mb-3">Reset Password</h3>

    <input id="contact" class="form-control mb-2" placeholder="Email or Mobile">

    <input id="newPassword" type="password" class="form-control mb-2" placeholder="New Password">

    <button class="btn btn-warning w-100" onclick="resetPassword()">Reset</button>

</div>

<script src="./main.js"></script>

</body>
</html>
