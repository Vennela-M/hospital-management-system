<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow" style="width:350px">

    <h3 class="text-center mb-3">Login</h3>

    <!-- ROLE DISPLAY -->
    <p class="text-center text-muted">Role: <span id="roleText"></span></p>

    <input id="contact" class="form-control mb-2" placeholder="Email or Mobile Number">
    
    <div class="input-group mb-2">
        <input id="password" type="password" class="form-control" placeholder="Password">
        <button class="btn btn-outline-secondary" onclick="togglePassword()">👁️</button>
    </div>

    <button class="btn btn-primary w-100 mb-2" onclick="login()">Login</button>

    <p class="text-center">
        <a href="forgot.html">Forgot Password?</a>
    </p>

    <p class="text-center">
        Don’t have an account? <a href="signup.html">Signup</a>
    </p>

</div>

<script src="js/main.js"></script>

<script>
    // show selected role
    const role = localStorage.getItem("role");
    document.getElementById("roleText").innerText = role || "user";
</script>

</body>
</html>
