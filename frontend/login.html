<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MediCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fas fa-hospital text-primary me-2"></i>
                <span class="fw-bold">MediCare</span>
            </a>
        </div>
    </nav>

    <!-- Login Section -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-primary text-white text-center py-4">
                        <i class="fas fa-sign-in-alt fa-2x mb-2"></i>
                        <h4 class="mb-0">Welcome Back</h4>
                        <p class="mb-0 opacity-75">Sign in to your account</p>
                    </div>

                    <div class="card-body p-4">
                        <!-- Role Selection -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Login as:</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="role" id="user" value="user" checked>
                                <label class="btn btn-outline-primary" for="user">
                                    <i class="fas fa-user-injured me-1"></i>Patient
                                </label>

                                <input type="radio" class="btn-check" name="role" id="doctor" value="doctor">
                                <label class="btn btn-outline-success" for="doctor">
                                    <i class="fas fa-user-md me-1"></i>Doctor
                                </label>

                                <input type="radio" class="btn-check" name="role" id="admin" value="admin">
                                <label class="btn btn-outline-warning" for="admin">
                                    <i class="fas fa-cog me-1"></i>Admin
                                </label>
                            </div>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="contact" class="form-label">
                                    <i class="fas fa-envelope me-1"></i>Email or Phone
                                </label>
                                <input type="text" class="form-control" id="contact"
                                       placeholder="Enter your email or phone number" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock me-1"></i>Password
                                </label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password"
                                           placeholder="Enter your password" required>
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    Remember me
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                                <i class="fas fa-sign-in-alt me-2"></i>Sign In
                            </button>
                        </form>

                        <!-- Additional Links -->
                        <div class="text-center">
                            <a href="forgot.html" class="text-decoration-none">
                                <i class="fas fa-key me-1"></i>Forgot Password?
                            </a>
                        </div>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="mb-2">Don't have an account?</p>
                            <a href="signup.html" class="btn btn-outline-primary">
                                <i class="fas fa-user-plus me-1"></i>Create Account
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Quick Stats -->
                <div class="row mt-4 g-3">
                    <div class="col-4">
                        <div class="text-center">
                            <div class="h5 mb-0 text-primary">10K+</div>
                            <small class="text-muted">Patients</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="text-center">
                            <div class="h5 mb-0 text-success">500+</div>
                            <small class="text-muted">Doctors</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="text-center">
                            <div class="h5 mb-0 text-info">24/7</div>
                            <small class="text-muted">Support</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

    <script>
        // Handle role selection
        document.querySelectorAll('input[name="role"]').forEach(radio => {
            radio.addEventListener('change', function() {
                localStorage.setItem("role", this.value);
            });
        });

        // Set initial role
        const savedRole = localStorage.getItem("role") || "user";
        document.getElementById(savedRole).checked = true;

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            login();
        });

        // Auto-focus first input
        document.getElementById('contact').focus();
    </script>
</body>
</html>
