<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Dashboard - AroVyuha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <i class="fas fa-hospital text-primary me-2"></i>
            <span class="fw-bold">AroVyuha</span>
            <span class="badge bg-success ms-2">Hospital</span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-muted fw-semibold"><i class="fas fa-building me-1"></i><span id="hospitalName">Loading...</span></span>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                <i class="fas fa-sign-out-alt me-1"></i>Logout
            </button>
        </div>
    </div>
</nav>

    <!-- Alert Banner Stack - Auto-displayed on all dashboards -->
    <div id="alertBannerStack"></div>

<div class="container-fluid px-4 py-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Hospital Dashboard</h2>
            <p class="text-muted mb-0" id="hospitalAddress">Loading...</p>
        </div>
        <div id="currentDate" class="text-muted text-end small"></div>
    </div>

    <!-- Stats row -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card text-center border-0 shadow-sm">
                <div class="card-body py-3">
                    <div class="h3 mb-0 text-primary" id="statDoctors">—</div>
                    <small class="text-muted">Doctors</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center border-0 shadow-sm">
                <div class="card-body py-3">
                    <div class="h3 mb-0 text-success" id="statAvailBeds">—</div>
                    <small class="text-muted">Available Beds</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center border-0 shadow-sm">
                <div class="card-body py-3">
                    <div class="h3 mb-0 text-warning" id="statTotalBeds">—</div>
                    <small class="text-muted">Total Beds</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center border-0 shadow-sm">
                <div class="card-body py-3">
                    <div class="h3 mb-0 text-info" id="statDepts">—</div>
                    <small class="text-muted">Departments</small>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">

        <!-- Hospital Info + Bed Management -->
        <div class="col-lg-5">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="fas fa-info-circle me-2"></i>Hospital Information</h5>
                    <button class="btn btn-sm btn-light" onclick="showBedUpdateForm()">
                        <i class="fas fa-bed me-1"></i>Update Beds
                    </button>
                </div>
                <div class="card-body" id="hospitalInfo">
                    <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
                </div>
            </div>

            <!-- Bed update form (hidden by default) -->
            <div class="card shadow-sm border-warning" id="bedUpdateCard" style="display:none;">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0"><i class="fas fa-bed me-2"></i>Update Bed Availability</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label">Total Beds</label>
                            <input type="number" class="form-control" id="inputTotalBeds" min="0">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Available Beds</label>
                            <input type="number" class="form-control" id="inputAvailBeds" min="0">
                        </div>
                    </div>
                    <div id="bedUpdateMsg" class="mt-2"></div>
                    <div class="mt-3 d-flex gap-2">
                        <button class="btn btn-warning" onclick="saveBedUpdate()">
                            <i class="fas fa-save me-1"></i>Save
                        </button>
                        <button class="btn btn-secondary" onclick="hideBedUpdateForm()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Departments -->
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="fas fa-sitemap me-2"></i>Departments</h5>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush" id="departmentList">
                        <li class="list-group-item text-center py-4">
                            <div class="spinner-border spinner-border-sm text-success"></div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Doctor Management -->
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="fas fa-user-md me-2"></i>Assigned Doctors</h5>
                    <button class="btn btn-sm btn-light" onclick="showAssignDoctorForm()">
                        <i class="fas fa-plus me-1"></i>Assign Doctor
                    </button>
                </div>

                <!-- Assign doctor form (hidden by default) -->
                <div id="assignDoctorForm" style="display:none;" class="border-bottom p-3 bg-light">
                    <div class="row g-2 align-items-end">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">Select Doctor to Assign</label>
                            <select class="form-select" id="assignDoctorSelect">
                                <option value="">Loading doctors...</option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex gap-2">
                            <button class="btn btn-success flex-fill" onclick="doAssignDoctor()">
                                <i class="fas fa-check me-1"></i>Assign
                            </button>
                            <button class="btn btn-secondary" onclick="hideAssignDoctorForm()">Cancel</button>
                        </div>
                    </div>
                    <div id="assignDoctorMsg" class="mt-2"></div>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Name</th>
                                    <th>Specialization</th>
                                    <th>Experience</th>
                                    <th>Working Days</th>
                                    <th>Hours</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="doctorsList">
                                <tr><td colspan="6" class="text-center py-4">
                                    <div class="spinner-border spinner-border-sm text-info"></div>
                                </td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = 'http://localhost:5000';
    let currentHospitalId = null;

    function logout() {
        if (confirm('Logout?')) { localStorage.removeItem('user'); window.location = 'login.html'; }
    }

    function authHeaders() {
        const u = JSON.parse(localStorage.getItem('user'));
        return { Authorization: `Bearer ${u?.token}` };
    }

    document.addEventListener('DOMContentLoaded', () => {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'hospital') {
            alert('Access denied. Please log in as a hospital.');
            window.location = 'login.html';
            return;
        }
        document.getElementById('currentDate').textContent =
            new Date().toLocaleDateString('en-IN', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
        loadHospitalDashboard();
    });

    // ── Load dashboard ────────────────────────────────────────────────────────
    async function loadHospitalDashboard() {
        try {
            const meRes  = await fetch(`${API}/api/auth/me`, { headers: authHeaders() });
            const meJson = await meRes.json();
            const hospitalId = meJson.data?.user?.hospitalRef;

            if (!hospitalId) {
                document.getElementById('hospitalInfo').innerHTML =
                    '<div class="alert alert-warning">No hospital linked to this account. Contact admin.</div>';
                return;
            }

            currentHospitalId = hospitalId;
            await refreshHospital();
        } catch (err) {
            console.error('Dashboard error:', err);
            document.getElementById('hospitalInfo').innerHTML =
                '<div class="alert alert-danger">Network error loading dashboard.</div>';
        }
    }

    async function refreshHospital() {
        const res  = await fetch(`${API}/api/hospital/${currentHospitalId}`, { headers: authHeaders() });
        const json = await res.json();
        if (!res.ok) {
            document.getElementById('hospitalInfo').innerHTML =
                `<div class="alert alert-danger">${json.message || 'Error loading hospital'}</div>`;
            return;
        }
        const h = json.data?.hospital || json;
        renderHospital(h);
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function renderHospital(h) {
        document.getElementById('hospitalName').textContent    = h.name;
        document.getElementById('hospitalAddress').textContent = h.address || '';

        document.getElementById('statDoctors').textContent   = (h.doctors || []).length;
        document.getElementById('statAvailBeds').textContent = h.availableBeds ?? 0;
        document.getElementById('statTotalBeds').textContent = h.totalBeds ?? 0;
        document.getElementById('statDepts').textContent     = (h.departments || []).length;

        // Pre-fill bed inputs
        document.getElementById('inputTotalBeds').value = h.totalBeds ?? 0;
        document.getElementById('inputAvailBeds').value = h.availableBeds ?? 0;

        // Info card
        const occupied = (h.totalBeds || 0) - (h.availableBeds || 0);
        const pct      = h.totalBeds > 0 ? Math.round((occupied / h.totalBeds) * 100) : 0;
        document.getElementById('hospitalInfo').innerHTML = `
            <p><i class="fas fa-map-marker-alt text-danger me-2"></i><strong>Location:</strong> ${h.address || 'N/A'}</p>
            <p><i class="fas fa-phone text-success me-2"></i><strong>Phone:</strong> ${h.phone || 'N/A'}</p>
            <p><i class="fas fa-envelope text-primary me-2"></i><strong>Email:</strong> ${h.email || 'N/A'}</p>
            <p><i class="fas fa-globe text-info me-2"></i><strong>Website:</strong>
                ${h.website ? `<a href="${h.website}" target="_blank">${h.website}</a>` : 'N/A'}</p>
            <p class="mb-0"><i class="fas fa-info-circle text-muted me-2"></i>${h.description || 'No description.'}</p>
            ${h.totalBeds > 0 ? `
            <hr>
            <div class="d-flex justify-content-between mb-1">
                <small class="text-muted">Bed Occupancy</small>
                <small>${pct}% occupied</small>
            </div>
            <div class="progress" style="height:10px;">
                <div class="progress-bar bg-${pct>80?'danger':pct>60?'warning':'success'}" style="width:${pct}%"></div>
            </div>
            <div class="row text-center mt-2">
                <div class="col-4"><div class="fw-bold text-warning">${h.totalBeds}</div><small class="text-muted">Total</small></div>
                <div class="col-4"><div class="fw-bold text-success">${h.availableBeds}</div><small class="text-muted">Available</small></div>
                <div class="col-4"><div class="fw-bold text-danger">${occupied}</div><small class="text-muted">Occupied</small></div>
            </div>` : '<p class="text-muted mt-2 mb-0 small">No bed data. Click "Update Beds" to add.</p>'}
        `;

        // Departments
        const deptList = document.getElementById('departmentList');
        deptList.innerHTML = (h.departments || []).length
            ? h.departments.map(d => `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <span><i class="fas fa-stethoscope text-primary me-2"></i>${d.name}</span>
                        ${d.head ? `<small class="text-muted d-block">Head: ${d.head}</small>` : ''}
                        <small class="text-muted d-block">
                            <i class="fas fa-user-md me-1"></i>${d.doctorCount || 0} doctors
                            <span class="mx-2">|</span>
                            <i class="fas fa-bed me-1"></i>${d.bedCount || h.availableBeds || 0} beds
                        </small>
                    </div>
                </li>`).join('')
            : '<li class="list-group-item text-muted text-center py-3">No departments configured. Contact admin to add departments.</li>';

        // Doctors table
        const tbody = document.getElementById('doctorsList');
        if (!h.doctors || !h.doctors.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">No doctors assigned yet. Use "Assign Doctor" to add.</td></tr>';
        } else {
            tbody.innerHTML = h.doctors.map(d => {
                const days  = (d.availability || []).map(a => a.day.slice(0,3).toUpperCase()).join(', ') || '—';
                const hours = d.availability?.length
                    ? `${d.availability[0].startTime} – ${d.availability[0].endTime}`
                    : '—';
                return `
                <tr>
                    <td class="fw-semibold">${d.name}</td>
                    <td><span class="badge bg-info">${d.specialization || '—'}</span></td>
                    <td>${d.experience != null ? d.experience + ' yrs' : '—'}</td>
                    <td><small>${days}</small></td>
                    <td><small>${hours}</small></td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger" onclick="removeDoctor('${d._id}','${d.name}')">
                            <i class="fas fa-times me-1"></i>Remove
                        </button>
                    </td>
                </tr>`;
            }).join('');
        }
    }

    // ── Bed update ────────────────────────────────────────────────────────────
    function showBedUpdateForm() {
        document.getElementById('bedUpdateCard').style.display = 'block';
        document.getElementById('bedUpdateMsg').innerHTML = '';
    }
    function hideBedUpdateForm() {
        document.getElementById('bedUpdateCard').style.display = 'none';
    }

    async function saveBedUpdate() {
        const totalBeds     = parseInt(document.getElementById('inputTotalBeds').value);
        const availableBeds = parseInt(document.getElementById('inputAvailBeds').value);
        const msgEl         = document.getElementById('bedUpdateMsg');

        if (isNaN(totalBeds) || isNaN(availableBeds)) {
            msgEl.innerHTML = '<div class="alert alert-warning py-1">Enter valid numbers.</div>';
            return;
        }
        if (availableBeds > totalBeds) {
            msgEl.innerHTML = '<div class="alert alert-warning py-1">Available beds cannot exceed total beds.</div>';
            return;
        }

        try {
            const res  = await fetch(`${API}/api/hospital/${currentHospitalId}/beds`, {
                method:  'PATCH',
                headers: { ...authHeaders(), 'Content-Type': 'application/json' },
                body:    JSON.stringify({ totalBeds, availableBeds }),
            });
            const json = await res.json();
            if (res.ok) {
                msgEl.innerHTML = '<div class="alert alert-success py-1"><i class="fas fa-check me-1"></i>Saved!</div>';
                setTimeout(() => { hideBedUpdateForm(); refreshHospital(); }, 800);
            } else {
                msgEl.innerHTML = `<div class="alert alert-danger py-1">${json.message || 'Error saving'}</div>`;
            }
        } catch (err) {
            console.error(err);
            msgEl.innerHTML = '<div class="alert alert-danger py-1">Network error.</div>';
        }
    }

    // ── Assign doctor ─────────────────────────────────────────────────────────
    async function showAssignDoctorForm() {
        document.getElementById('assignDoctorForm').style.display = 'block';
        document.getElementById('assignDoctorMsg').innerHTML = '';

        const select = document.getElementById('assignDoctorSelect');
        select.innerHTML = '<option value="">Loading...</option>';

        try {
            const res  = await fetch(`${API}/api/doctor`, { headers: authHeaders() });
            const json = await res.json();
            const doctors = json.data?.doctors || [];

            // Get currently assigned doctor IDs to exclude them
            const assignedRes  = await fetch(`${API}/api/hospital/${currentHospitalId}`, { headers: authHeaders() });
            const assignedJson = await assignedRes.json();
            const assigned = new Set((assignedJson.data?.hospital?.doctors || []).map(d => String(d._id)));

            const available = doctors.filter(d => !assigned.has(String(d._id)));

            select.innerHTML = available.length
                ? '<option value="">Select a doctor</option>' +
                  available.map(d => `<option value="${d._id}">${d.name} — ${d.specialization}</option>`).join('')
                : '<option value="">All doctors already assigned</option>';
        } catch (err) {
            console.error(err);
            select.innerHTML = '<option value="">Error loading doctors</option>';
        }
    }

    function hideAssignDoctorForm() {
        document.getElementById('assignDoctorForm').style.display = 'none';
    }

    async function doAssignDoctor() {
        const doctorId = document.getElementById('assignDoctorSelect').value;
        const msgEl    = document.getElementById('assignDoctorMsg');
        if (!doctorId) { alert('Please select a doctor.'); return; }

        try {
            const res  = await fetch(`${API}/api/hospital/${currentHospitalId}/assign-doctor`, {
                method:  'POST',
                headers: { ...authHeaders(), 'Content-Type': 'application/json' },
                body:    JSON.stringify({ doctorId }),
            });
            const json = await res.json();
            if (res.ok) {
                msgEl.innerHTML = '<div class="alert alert-success py-1"><i class="fas fa-check me-1"></i>Doctor assigned!</div>';
                setTimeout(() => { hideAssignDoctorForm(); refreshHospital(); }, 800);
            } else {
                msgEl.innerHTML = `<div class="alert alert-danger py-1">${json.message || 'Error assigning doctor'}</div>`;
            }
        } catch (err) {
            console.error(err);
            msgEl.innerHTML = '<div class="alert alert-danger py-1">Network error.</div>';
        }
    }

    async function removeDoctor(doctorId, doctorName) {
        // Remove "Dr." prefix if already present to avoid duplicates like "Dr.Dr.Imran Khan"
        const cleanName = doctorName.replace(/^Dr\.\s*/i, '');
        if (!confirm(`Remove Dr. ${cleanName} from this hospital?`)) return;
        try {
            const res  = await fetch(`${API}/api/hospital/${currentHospitalId}/assign-doctor/${doctorId}`, {
                method:  'DELETE',
                headers: authHeaders(),
            });
            const json = await res.json();
            if (res.ok) {
                refreshHospital();
            } else {
                alert(json.message || 'Error removing doctor');
            }
        } catch (err) {
            console.error(err);
            alert('Network error');
        }
    }
</script>
</body>
</html>
